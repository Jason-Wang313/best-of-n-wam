[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "best-of-n-wam"
version = "0.1.0"
description = "Exact test-time inference laws for World-Action Model rollout planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = [
  "gymnasium[mujoco]>=1.2",
  "gymnasium-robotics>=1.4",
  "mani-skill>=3.0.1",
  "metaworld>=3.0.0",
  "robosuite>=1.5.2",
  "imageio>=2.14",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

